name: Send job alerts

# Weekly digest email for anyone who's turned on alerts at /app/alerts.
# Monday 09:00 IST = 03:30 UTC. Skips cleanly if Supabase / Resend secrets
# aren't set (see scripts/alerts/send-alerts.ts).

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch: {}

concurrency:
  group: send-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
        run: node scripts/alerts/send-alerts.ts
