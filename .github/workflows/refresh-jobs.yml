name: Refresh jobs

# Re-reads every job source and commits an updated src/data/jobs.json.
# Runs every 5 hours; Vercel redeploys automatically on the commit.

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A typical run is a few minutes. This is a backstop: without it a single
    # hung source could sit here for GitHub's 6-hour default and — because the
    # concurrency group above never cancels in progress — block every later
    # refresh behind it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ingestion
        env:
          # Optional — set these as repo secrets to also mirror jobs into
          # Supabase. Without them the step just writes jobs.json.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingest/index.ts

      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/jobs.json; then
            echo "No changes to jobs.json"
            exit 0
          fi
          git config user.name "pm-dream-job-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/jobs.json
          git commit -m "chore(data): refresh jobs"

          # Retry the push. Two things make a single attempt too fragile for an
          # unattended job: a transient GitHub write error (seen in the wild —
          # "remote: fatal error in commit_refs" rejected a push here), and a
          # plain race if a human pushes between our checkout and our push.
          # Without a retry either one silently leaves the board stale until
          # the next run, five hours later.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing on origin/main and retrying…"
            sleep $((attempt * 10))
            # Our commit only ever touches the generated jobs.json, so replaying
            # it on top of whatever landed upstream is always the right move.
            git pull --rebase --autostash origin main || true
          done
          echo "::error::Could not push refreshed jobs.json after 3 attempts."
          exit 1
